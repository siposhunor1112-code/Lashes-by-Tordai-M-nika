<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Naptár – Lashes by Tordai Mónika</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f1eb">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css?v=2">
  <link rel="stylesheet" href="/admin.css?v=1">
  <script src="/admin.js?v=1" defer></script>
</head>
<body class="page admin">
  <header class="top is-scrolled">
    <div class="top__in wrap">
      <a class="brand" href="/" aria-label="Főoldal">
        <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true"><use href="#lashmark"/></svg>
        <span class="brand__text"><b>Naptár</b><small>Lashes by Tordai Mónika</small></span>
      </a>
      <button class="btn btn--ghost btn--sm" type="button" data-logout hidden>Kilépés</button>
    </div>
  </header>

  <!-- belépés -->
  <main class="page__main wrap" data-login-view>
    <form class="card" data-login>
      <p class="eyebrow">Admin</p>
      <h1 class="card__title">Szia, <em>Mónika!</em></h1>
      <div class="field">
        <label for="pw">Jelszó</label>
        <input id="pw" name="pw" type="password" autocomplete="current-password" required>
      </div>
      <p class="form__error" data-login-error hidden></p>
      <button class="btn btn--ink btn--block" type="submit" style="margin-top:18px">Belépés</button>
    </form>
  </main>

  <!-- naptár -->
  <main class="adm wrap" data-app hidden>
    <section class="adm__agenda">
      <div class="adm__bar">
        <h1>Foglalások</h1>
        <div class="seg" role="group" aria-label="Időszak">
          <button type="button" data-range="7" aria-pressed="true">7 nap</button>
          <button type="button" data-range="30" aria-pressed="false">30 nap</button>
          <button type="button" data-range="60" aria-pressed="false">60 nap</button>
          <button type="button" data-range="-30" aria-pressed="false">Elmúlt 30</button>
        </div>
      </div>
      <p class="adm__stats" data-stats></p>
      <label class="check adm__showcancel"><input type="checkbox" data-show-cancelled><span>Lemondottak is</span></label>
      <div data-agenda></div>
    </section>

    <aside class="adm__side">
      <details class="panel" open>
        <summary>Telefonos foglalás felvétele</summary>
        <form class="form" data-new>
          <div class="field"><label for="n-service">Szolgáltatás</label><select id="n-service" name="service" required></select></div>
          <div class="field-row">
            <div class="field"><label for="n-date">Nap</label><input id="n-date" name="date" type="date" required></div>
            <div class="field"><label for="n-time">Kezdés</label><input id="n-time" name="time" type="time" step="900" required></div>
          </div>
          <div class="field"><label for="n-name">Név</label><input id="n-name" name="name" required maxlength="80"></div>
          <div class="field"><label for="n-phone">Telefon</label><input id="n-phone" name="phone" type="tel" required maxlength="30"></div>
          <div class="field"><label for="n-note">Megjegyzés</label><input id="n-note" name="note" maxlength="600"></div>
          <p class="form__error" data-new-error hidden></p>
          <button class="btn btn--ink btn--block" type="submit">Foglalás rögzítése</button>
        </form>
      </details>

      <details class="panel" open>
        <summary>Szabadnap, zárt sáv</summary>
        <form class="form" data-block>
          <div class="field-row">
            <div class="field"><label for="b-date">Ettől</label><input id="b-date" name="date" type="date" required></div>
            <div class="field"><label for="b-until">Eddig</label><input id="b-until" name="until" type="date"></div>
          </div>
          <label class="check"><input type="checkbox" name="whole" checked data-whole><span>Egész nap</span></label>
          <div class="field-row" data-times hidden>
            <div class="field"><label for="b-start">Tól</label><input id="b-start" name="start" type="time" step="900"></div>
            <div class="field"><label for="b-end">Ig</label><input id="b-end" name="end" type="time" step="900"></div>
          </div>
          <div class="field"><label for="b-reason">Megjegyzés (a vendégek látják)</label><input id="b-reason" name="reason" maxlength="80" placeholder="pl. szabadság, továbbképzés"></div>
          <p class="form__error" data-block-error hidden></p>
          <button class="btn btn--ink btn--block" type="submit">Letiltás</button>
        </form>
        <ul class="blocks" data-blocks></ul>
      </details>
      <p class="adm__hint">A foglalásokat az online naptár azonnal mutatja. A letiltott napok a vendégeknek „szabadnap”-ként jelennek meg.</p>
    </aside>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="lashmark" viewBox="0 0 40 40">
      <path d="M6 17c4.2 5.6 9 8.4 14 8.4s9.8-2.8 14-8.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
        <path d="M11.2 21.6l-2 3.8"/><path d="M15.4 24l-1.1 4.3"/><path d="M20 25l0 4.6"/><path d="M24.6 24l1.3 4.4"/><path d="M28.8 21.6l2.4 3.9"/><path d="M32 19l3 3"/>
      </g>
    </symbol>
  </svg>
</body>
</html>
